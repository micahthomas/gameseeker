# Test, migrate, deploy — in that order, on every push to main.
#
# This replaced Cloudflare Workers Builds, which deploys on push but knows
# nothing about the test suite or about D1 migrations. Workers Builds is now
# disconnected from the repository and **must stay that way** — with both
# connected every push deploys twice, and the Workers Builds one lands first,
# untested and ahead of its migrations, which is the exact failure this
# workflow exists to prevent.
#
# Secrets, both on the repository (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID
#   CLOUDFLARE_API_TOKEN   An account-scoped custom token. Four permissions,
#                          all under Account, and all four are load-bearing:
#
#                            Workers Scripts → Edit  the script itself, its
#                              Durable Object classes and their migrations,
#                              and the cron triggers
#                            D1 → Edit               `migrations apply
#                              --remote` executes SQL, so Read is not enough
#                            Queues → Edit           easy to miss: this Worker
#                              is a queue *consumer*, so deploying registers
#                              the consumer and its dead-letter queue
#                            Workers R2 Storage      deploy resolves the
#                              → Edit                CLINIC_MEDIA binding by
#                              fetching the bucket, so a token without this
#                              fails *after* migrations have applied — leaving
#                              the database ahead of the code until it's fixed
#
#                          **Adding a binding can mean adding a permission.**
#                          The failure surfaces as an opaque "Authentication
#                          error [code: 10000]" against the resource's API
#                          path, not as anything about the token.
#
#                          No zone permissions — the custom domain lives in the
#                          dashboard, not in wrangler.jsonc. No secrets access
#                          either: SESSION_SECRET and RESEND_API_TOKEN are set
#                          from a developer machine (`mise run secrets:*`), so
#                          this token cannot read or overwrite them.
#
# Pull requests run the full gate but never deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Queue pushes to main rather than cancelling: a cancelled job could stop
  # between `d1 migrations apply` and `wrangler deploy`, leaving the database
  # ahead of the code. PR runs are safe to cancel — they only run tests.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler otherwise prompts about telemetry on first run in a fresh runner.
  WRANGLER_SEND_METRICS: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # mise.toml is the single source of truth for the Node version, and it
      # pins an exact patch on purpose — see the comment there. Read it rather
      # than repeating the number here, so the two can't drift.
      - name: Resolve Node version from mise.toml
        id: node
        run: |
          version="$(sed -n 's/^node *= *"\(.*\)"/\1/p' mise.toml)"
          test -n "$version" || { echo "No node version found in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      # Two files typecheck depends on are generated, not committed, so a fresh
      # checkout hasn't got them and `tsc` fails with a few hundred errors about
      # missing D1Database and './routeTree.gen'. Both have to come first —
      # don't move typecheck above them.
      #
      #   worker-configuration.d.ts   `wrangler types`, needs no credentials
      #   src/routeTree.gen.ts        written by the TanStack Router plugin
      #                               during a build
      - name: Generate Worker types
        run: npm run cf-typegen

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Vitest inside workerd against a real (in-memory) D1. No credentials:
      # the pool creates the database locally.
      - name: Unit tests
        run: npm test

      # Only chromium — the 'mobile' project is a Pixel 7 profile, which is
      # also chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Boots a real dev server on 3100 against the local gameseeker-test D1.
      # Needs no secrets: MAIL_PROVIDER is "console" under CLOUDFLARE_ENV=test,
      # and SESSION_SECRET falls back in dev (see src/server/config.ts).
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Migrate and deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Node version from mise.toml
        id: node
        run: |
          version="$(sed -n 's/^node *= *"\(.*\)"/\1/p' mise.toml)"
          test -n "$version" || { echo "No node version found in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      # Migrations first, deploy second. A deploy whose code expects a column
      # the remote database hasn't got takes production down until the
      # migration lands, and this ordering is what makes that impossible.
      #
      # The reverse hazard is real but narrower, and it is on you rather than
      # on CI: a *destructive* migration (dropping a column the running code
      # still reads) breaks production from the moment it applies until this
      # job's deploy finishes, a minute or two later. If that window matters,
      # split the change across two releases — ship code that tolerates both
      # shapes, then drop the column in a later one.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply gameseeker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
